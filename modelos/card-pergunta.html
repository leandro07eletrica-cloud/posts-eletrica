<!doctype html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;font-family:'Inter',sans-serif;background:#FFC21A;color:#0E1A2B;position:relative;overflow:hidden}
  .bolt{position:absolute;right:-160px;bottom:120px;width:700px;opacity:.10}
  .wrap{padding:90px 90px 0 90px;position:relative;zoom:var(--z,1)}
  .tag{display:inline-block;background:#0E1A2B;color:#FFC21A;font-weight:800;font-size:30px;letter-spacing:2px;padding:12px 26px;border-radius:8px;text-transform:uppercase}
  h1{font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:124px;line-height:.98;margin-top:56px;letter-spacing:-4px}
  h1 .l{display:block}
  .y{background:#0E1A2B;color:#FFC21A;padding:0 .14em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .resp{margin-top:60px;font-size:46px;font-weight:600;line-height:1.3;max-width:860px}
  .resp b{font-weight:900}
  .cta{margin-top:44px;font-size:40px;font-weight:800;display:inline-block;border-top:6px solid #0E1A2B;padding-top:22px}
  .foot{position:absolute;left:0;right:0;bottom:0;height:170px;background:#0E1A2B;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 90px}
  .name{font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:46px;letter-spacing:-1px;line-height:1.05;color:#FFC21A}
  .name small{display:block;font-family:'Inter';font-weight:600;font-size:28px;letter-spacing:0;margin-top:6px;color:#C9D3E0}
  .wpp{text-align:right;font-weight:800;font-size:44px;line-height:1.1;white-space:nowrap}
  .wpp small{display:block;font-weight:600;font-size:26px;color:#C9D3E0}
</style></head>
<body>
<svg class="bolt" viewBox="0 0 100 160"><path d="M60 0 L5 95 H45 L35 160 L95 60 H55 Z" fill="#0E1A2B"/></svg>
<div class="wrap" id="conteudo">
  <div class="tag">{{ETIQUETA}}</div>
  <h1>{{TITULO}}</h1>
  <div class="resp">{{RESPOSTA}}</div>
  <div class="cta">{{CTA}}</div>
</div>
<div class="foot" id="rodape">
  <div class="name">Leandro Cruz<small>Eletricista · Santa Teresa e região</small></div>
  <div class="wpp"><small>Chama no WhatsApp</small>(27) 99855-6375</div>
</div>
</body></html>

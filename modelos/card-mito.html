<!doctype html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;font-family:'Inter',sans-serif;background:#EEF1F5;color:#0E1A2B;position:relative;overflow:hidden}
  .wrap{padding:84px 90px 0 90px;position:relative;zoom:var(--z,1)}
  .top{font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:108px;letter-spacing:-3px;line-height:1}
  .top span{color:#D93A26}
  .sub{font-size:40px;font-weight:600;color:#55657A;margin-top:22px}
  .bloco{margin-top:56px;border-radius:18px;padding:48px 50px}
  .mito{background:#fff;border:4px solid #D93A26}
  .verdade{background:#0E1A2B;color:#fff;margin-top:32px}
  .chip{display:inline-block;font-weight:900;font-size:30px;letter-spacing:3px;padding:10px 22px;border-radius:8px;text-transform:uppercase}
  .mito .chip{background:#D93A26;color:#fff}
  .verdade .chip{background:#FFC21A;color:#0E1A2B}
  .txt{margin-top:26px;font-size:56px;font-weight:700;line-height:1.22}
  .mito .txt{color:#55657A;text-decoration:line-through;text-decoration-color:#D93A26;text-decoration-thickness:5px}
  .verdade .txt b{color:#FFC21A}
  .cta{margin-top:52px;font-size:44px;font-weight:800;line-height:1.25}
  .cta b{color:#D93A26}
  .foot{position:absolute;left:0;right:0;bottom:0;height:170px;background:#0E1A2B;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 90px}
  .name{font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:46px;letter-spacing:-1px;line-height:1.05;color:#FFC21A}
  .name small{display:block;font-family:'Inter';font-weight:600;font-size:28px;letter-spacing:0;margin-top:6px;color:#C9D3E0}
  .wpp{text-align:right;font-weight:800;font-size:44px;line-height:1.1;white-space:nowrap}
  .wpp small{display:block;font-weight:600;font-size:26px;color:#C9D3E0}
</style></head>
<body>
<div class="wrap" id="conteudo">
  <div class="top">Mito ou <span>verdade?</span></div>
  <div class="sub">{{ETIQUETA}}</div>
  <div class="bloco mito"><div class="chip">Mito</div><div class="txt">{{MITO}}</div></div>
  <div class="bloco verdade"><div class="chip">Verdade</div><div class="txt">{{VERDADE}}</div></div>
  <div class="cta">{{CTA}}</div>
</div>
<div class="foot" id="rodape">
  <div class="name">Leandro Cruz<small>Eletricista · Santa Teresa e região</small></div>
  <div class="wpp"><small>Chama no WhatsApp</small>(27) 99855-6375</div>
</div>
</body></html>

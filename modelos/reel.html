<!doctype html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1920px;font-family:'Inter',sans-serif;background:#0E1A2B;color:#fff;position:relative;overflow:hidden}
  .bolt{position:absolute;right:-180px;top:120px;width:760px;opacity:.06;animation:drift {{DUR}}s linear both}
  @keyframes drift{from{transform:translateY(0) rotate(0)}to{transform:translateY(-120px) rotate(4deg)}}
  .wrap{position:absolute;left:90px;right:90px;top:150px;zoom:var(--z,1)}
  .tag{display:inline-block;background:#FFC21A;color:#0E1A2B;font-weight:800;font-size:34px;letter-spacing:3px;padding:14px 28px;border-radius:8px;text-transform:uppercase;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) .1s both}
  h1{font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:108px;line-height:1.0;margin-top:36px;letter-spacing:-3px}
  h1 .l{display:block;animation:up .6s cubic-bezier(.2,.8,.2,1) both}
  .y{color:#FFC21A}
  .sub{font-size:50px;font-weight:600;color:#C9D3E0;margin-top:32px;animation:up .5s ease {{T_SUB}}s both}
  .list{margin-top:40px;display:flex;flex-direction:column;gap:20px}
  .item{display:flex;align-items:center;gap:32px;background:#16263D;border-radius:14px;padding:26px 36px;font-size:44px;font-weight:600;line-height:1.2;animation:slide .55s cubic-bezier(.2,.8,.2,1) both}
  .num{flex:0 0 76px;height:76px;border-radius:50%;background:#FFC21A;color:#0E1A2B;font-weight:900;font-size:42px;display:flex;align-items:center;justify-content:center}
  .item b{color:#FFC21A}
  .warn{margin-top:36px;border:4px solid #FF5A3C;border-radius:14px;padding:30px 38px;font-size:46px;font-weight:800;line-height:1.2;animation:up .5s ease {{T_WARN}}s both, pulse 1s ease {{T_WARN2}}s 2}
  .warn b{color:#FF7A5C}
  .foot{position:absolute;left:0;right:0;bottom:0;height:270px;background:#FFC21A;color:#0E1A2B;display:flex;flex-direction:column;justify-content:center;padding:0 90px;animation:rise .6s cubic-bezier(.2,.8,.2,1) {{T_FOOT}}s both}
  .cta{font-weight:700;font-size:40px}
  .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
  .name{font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:58px;letter-spacing:-1px;line-height:1}
  .name small{display:block;font-family:'Inter';font-weight:600;font-size:28px;letter-spacing:0;margin-top:8px;white-space:nowrap}
  .wpp{font-weight:900;font-size:50px;white-space:nowrap}
  /* Tema amarelo: alterna com o escuro para o grid do perfil não ficar repetido */
  body.amarelo{background:#FFC21A;color:#0E1A2B}
  body.amarelo .bolt path{fill:#0E1A2B}
  body.amarelo .tag{background:#0E1A2B;color:#FFC21A}
  body.amarelo .y{background:#0E1A2B;color:#FFC21A;padding:0 .12em}
  body.amarelo .sub{color:#0E1A2B;opacity:.85}
  body.amarelo .item{background:rgba(14,26,43,.10)}
  body.amarelo .item b{color:#0E1A2B;font-weight:900}
  body.amarelo .num{background:#0E1A2B;color:#FFC21A}
  body.amarelo .warn{border-color:#0E1A2B;background:#0E1A2B;color:#fff}
  body.amarelo .warn b{color:#FFC21A}
  body.amarelo .foot{background:#0E1A2B;color:#fff}
  body.amarelo .name{color:#FFC21A}
  body.amarelo .name small{color:#C9D3E0}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  @keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
  @keyframes slide{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
  @keyframes rise{from{transform:translateY(100%)}to{transform:none}}
  @keyframes pulse{50%{transform:scale(1.03)}}
</style></head>
<body class="{{TEMA}}">
<svg class="bolt" viewBox="0 0 100 160"><path d="M60 0 L5 95 H45 L35 160 L95 60 H55 Z" fill="#FFC21A"/></svg>
<div class="wrap" id="conteudo">
  <div class="tag">{{ETIQUETA}}</div>
  <h1>{{TITULO}}</h1>
  <div class="sub">{{SUBTITULO}}</div>
  <div class="list">{{ITENS}}</div>
  {{ALERTA}}
</div>
<div class="foot" id="rodape">
  <div class="cta">{{CTA}}</div>
  <div class="row">
    <div class="name">Leandro Cruz<small>Eletricista · Santa Teresa e região</small></div>
    <div class="wpp">(27) 99855-6375</div>
  </div>
</div>
</body></html>

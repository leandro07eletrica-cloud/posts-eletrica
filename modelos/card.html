<!doctype html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;font-family:'Inter',sans-serif;background:#0E1A2B;color:#fff;position:relative;overflow:hidden}
  .bolt{position:absolute;right:-120px;top:-60px;width:620px;opacity:.07}
  .wrap{padding:80px 90px 0 90px;position:relative;zoom:var(--z,1)}
  .tag{display:inline-block;background:#FFC21A;color:#0E1A2B;font-weight:800;font-size:30px;letter-spacing:2px;padding:12px 26px;border-radius:8px;text-transform:uppercase}
  h1{font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:96px;line-height:1.02;margin-top:38px;letter-spacing:-2px}
  h1 .l{display:block}
  .y{color:#FFC21A}
  .sub{font-size:44px;font-weight:500;color:#C9D3E0;margin-top:30px;line-height:1.25}
  .list{margin-top:44px;display:flex;flex-direction:column;gap:18px}
  .item{display:flex;align-items:center;gap:30px;background:#16263D;border-left:8px solid #FFC21A;border-radius:12px;padding:24px 36px;font-size:40px;font-weight:600;line-height:1.2}
  .item b{color:#FFC21A}
  .num{flex:0 0 64px;height:64px;border-radius:50%;background:#FFC21A;color:#0E1A2B;font-weight:900;font-size:36px;display:flex;align-items:center;justify-content:center}
  .cta{margin-top:30px;font-size:42px;font-weight:700;line-height:1.25}
  .cta b{color:#FFC21A}
  .foot{position:absolute;left:0;right:0;bottom:0;height:170px;background:#FFC21A;color:#0E1A2B;display:flex;align-items:center;justify-content:space-between;padding:0 90px}
  .name{font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:46px;letter-spacing:-1px;line-height:1.05}
  .name small{display:block;font-family:'Inter';font-weight:600;font-size:28px;letter-spacing:0;margin-top:6px}
  .wpp{text-align:right;font-weight:800;font-size:44px;line-height:1.1;white-space:nowrap}
  .wpp small{display:block;font-weight:600;font-size:26px}
</style></head>
<body>
<svg class="bolt" viewBox="0 0 100 160"><path d="M60 0 L5 95 H45 L35 160 L95 60 H55 Z" fill="#FFC21A"/></svg>
<div class="wrap" id="conteudo">
  <div class="tag">{{ETIQUETA}}</div>
  <h1>{{TITULO}}</h1>
  <div class="sub">{{SUBTITULO}}</div>
  <div class="list">{{ITENS}}</div>
  <div class="cta">{{CTA}}</div>
</div>
<div class="foot" id="rodape">
  <div class="name">Leandro Cruz<small>Eletricista · Santa Teresa e região</small></div>
  <div class="wpp"><small>Chama no WhatsApp</small>(27) 99855-6375</div>
</div>
</body></html>
